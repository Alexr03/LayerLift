# Secrets for a public deployment. Copy to secrets.yaml (not committed), fill in, then:
#   kubectl apply -f deploy/k8s/secrets.yaml
# Or create it directly:
#   kubectl -n layerlift create secret generic layerlift-secrets \
#     --from-literal=LAYERLIFT_TURNSTILE_SITE_KEY=... \
#     --from-literal=LAYERLIFT_TURNSTILE_SECRET_KEY=... \
#     --from-literal=LAYERLIFT_SESSION_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: layerlift-secrets
  namespace: layerlift
type: Opaque
stringData:
  # Cloudflare dashboard -> Turnstile -> Add widget (hostname: your LayerLift domain).
  LAYERLIFT_TURNSTILE_SITE_KEY: "0x0000000000000000000000"
  LAYERLIFT_TURNSTILE_SECRET_KEY: "0x0000000000000000000000000000000000"
  # Any long random string; keeps visitors' sessions valid across restarts.
  LAYERLIFT_SESSION_SECRET: "change-me-to-a-long-random-string"
