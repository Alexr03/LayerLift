[project]
name = "layerlift"
version = "0.1.0"
description = "Turn flat-colour images into multi-colour 3D-printable reliefs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "scikit-learn>=1.5",
    "shapely>=2.0",
    "trimesh>=4.4",
    "manifold3d>=3.0",
    "mapbox-earcut>=1.0",
    "rtree>=1.3",
    "resvg-py>=0.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relief", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
